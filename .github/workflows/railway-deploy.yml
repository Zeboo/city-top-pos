name: Build and deploy to Railway

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: railway-production-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-web.txt

      - name: Install server dependencies
        run: python -m pip install -r requirements-web.txt

      - name: Validate Python and JavaScript
        run: |
          python -m compileall -q app
          node --check app/web/app.js
          node --check app/web/pos.js

      - name: Smoke-test the production server
        env:
          DATABASE_URL: sqlite+pysqlite:///${{ runner.temp }}/top-city-ci.db
          SESSION_SECRET: ci-only-session-secret
        run: |
          python -m uvicorn app.web:app --host 127.0.0.1 --port 8765 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8765/health; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Build production image
        run: docker build --tag top-city-pos:${{ github.sha }} .

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy and wait for Railway
        run: railway up --ci --service "${{ secrets.RAILWAY_SERVICE_ID }}"

name: Validate Railway build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: railway-production-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-web.txt

      - name: Install server dependencies
        run: python -m pip install -r requirements-web.txt

      - name: Validate Python and JavaScript
        run: |
          python -m compileall -q app
          node --check app/web/app.js
          node --check app/web/pos.js

      - name: Smoke-test the production server
        env:
          DATABASE_URL: sqlite+pysqlite:///${{ runner.temp }}/top-city-ci.db
          SESSION_SECRET: ci-only-session-secret
        run: |
          python -m uvicorn app.web:app --host 127.0.0.1 --port 8765 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8765/health; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Build production image
        run: docker build --tag top-city-pos:${{ github.sha }} .

name: Publish Windows POS auto-update

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows-pos-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up legacy-compatible Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-offline-legacy.txt

      - name: Install build dependencies
        run: python -m pip install -r requirements-offline-legacy.txt

      - name: Embed release version
        shell: pwsh
        run: Set-Content -LiteralPath app/build_version.py -Value "BUILD_VERSION = '${{ github.run_number }}'" -Encoding UTF8

      - name: Validate source
        shell: pwsh
        run: |
          python -m py_compile app/web.py app/offline_web_client_legacy.py
          node --check app/web/app.js
          node --check app/web/pos.js

      - name: Build Windows 10 executable
        run: python -m PyInstaller --noconfirm --clean top_city_offline_legacy_onefile.spec

      - name: Build fast-start Windows folder
        run: python -m PyInstaller --noconfirm --clean --distpath dist-fast --workpath build-fast top_city_offline_legacy.spec

      - name: Install installer compiler
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build single-file installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=${{ github.run_number }}" `
            "/DBuildSource=$pwd\dist-fast\TopCityPOSOffline" `
            "/DOutputDirectory=$pwd\dist" `
            "installer\TopCityPOSOffline.iss"

      - name: Create verified update manifest
        shell: pwsh
        run: |
          $exe = "dist/TopCityPOSOffline.exe"
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            version = "${{ github.run_number }}"
            url = "https://github.com/${{ github.repository }}/releases/latest/download/TopCityPOSOffline.exe"
            sha256 = $hash
          }
          $manifest | ConvertTo-Json | Set-Content -LiteralPath dist/update.json -Encoding UTF8
          Compress-Archive -Path "dist-fast/TopCityPOSOffline/*" -DestinationPath "dist/TopCityPOSOffline-Fast.zip" -CompressionLevel Optimal
          $fastHash = (Get-FileHash -LiteralPath "dist/TopCityPOSOffline-Fast.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          $fastManifest = [ordered]@{
            version = "${{ github.run_number }}"
            format = "zip"
            url = "https://github.com/${{ github.repository }}/releases/latest/download/TopCityPOSOffline-Fast.zip"
            sha256 = $fastHash
          }
          $fastManifest | ConvertTo-Json | Set-Content -LiteralPath dist/update-fast.json -Encoding UTF8

      - name: Publish latest automatic update
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "pos-auto-${{ github.run_number }}"
          gh release create $tag `
            dist/TopCityPOSOffline.exe dist/TopCityPOSOffline-Setup.exe `
            dist/update.json dist/TopCityPOSOffline-Fast.zip dist/update-fast.json `
            --repo "${{ github.repository }}" `
            --title "Top City POS automatic update ${{ github.run_number }}" `
            --notes "Automatic Windows POS build from commit ${{ github.sha }}." `
            --latest
          # GitHub can retain an older explicitly-marked latest release even
          # after `release create --latest`. Promote the new tag again via the
          # edit endpoint, then fail the workflow if clients would still see
          # an older manifest through /releases/latest.
          gh release edit $tag --repo "${{ github.repository }}" --latest
          $latestTag = gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name
          if ($latestTag -ne $tag) {
            throw "Latest release promotion failed: expected $tag, received $latestTag"
          }
